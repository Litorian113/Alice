name: Alice
options:
  bundleIdPrefix: com.alice
  deploymentTarget:
    iOS: "17.0"

targets:
  Alice:
    type: application
    platform: iOS
    sources:
      - path: Alice
    settings:
      base:
        # Keep the installed app identity and provisioning profile across the rename.
        PRODUCT_BUNDLE_IDENTIFIER: com.bobcompanion.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "R3Q58R4888"
        INFOPLIST_FILE: Alice/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
