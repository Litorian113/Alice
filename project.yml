name: BobCompanion
options:
  bundleIdPrefix: com.bobcompanion
  deploymentTarget:
    iOS: "17.0"

targets:
  BobCompanion:
    type: application
    platform: iOS
    sources:
      - path: BobCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobcompanion.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: BobCompanion/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
